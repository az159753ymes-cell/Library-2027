name: 發布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 建立公開網站檔案
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -R assets site/assets
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
